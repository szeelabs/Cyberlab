name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # fail fast instead of hanging for hours
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Validate registry and example manifests
        run: cyberlab manifest validate ../examples/manifests/*.yaml
      - name: Check committed JSON Schema is up to date
        run: |
          cyberlab manifest schema -o /tmp/schema.json
          diff -u ../spec/universe-manifest.schema.json /tmp/schema.json
      - name: Tests
        run: pytest

  docker-integration:
    # Starts real (hardened) containers through the API on the runner's Docker Engine.
    runs-on: ubuntu-latest
    timeout-minutes: 20  # fail fast instead of hanging for hours
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Real Docker integration tests
        env:
          CYBERLAB_DOCKER_TESTS: "1"
          CYBERLAB_DOCKER_BUILD_TESTS: "1"
          CYBERLAB_TEST_IMAGE_MIRROR: mirror.gcr.io
        run: pytest tests/test_docker_integration.py -v
      - name: Check nothing was left behind
        run: |
          test -z "$(docker ps -aq --filter label=dev.cyberlab.managed=true)"
          test -z "$(docker volume ls -q --filter label=dev.cyberlab.managed=true)"
          test -z "$(docker network ls -q --filter label=dev.cyberlab.managed=true)"

  image-plan:
    # Build list comes from the registry, so new tool packs are tested automatically.
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fail fast instead of hanging for hours
    needs: backend
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend'
      - id: plan
        run: echo "matrix=$(cyberlab --registry registry image matrix --bases ubuntu-24-04,debian-12)" >> "$GITHUB_OUTPUT"

  toolpack-images:
    # Builds every installable tool pack and checks each tool's command runs as the
    # unprivileged cyberlab user in a hardened container.
    name: toolpack (${{ matrix.pack }} on ${{ matrix.base }})
    runs-on: ubuntu-latest
    timeout-minutes: 20  # fail fast instead of hanging for hours
    needs: image-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend'
      - name: Render Dockerfile
        run: |
          cyberlab --registry registry image dockerfile --base "${{ matrix.base }}" \
            --packs "${{ matrix.pack }}" --mirror mirror.gcr.io > Dockerfile
          cat Dockerfile
      - name: Build
        run: docker build --tag pack-test - < Dockerfile
      - name: Smoke test
        run: |
          CMDS="$(cyberlab --registry registry image commands --base "${{ matrix.base }}" --packs "${{ matrix.pack }}")"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --network none pack-test bash -c "
              set -e
              test \"\$(whoami)\" = cyberlab
              for c in $CMDS; do command -v \$c >/dev/null || { echo missing \$c; exit 1; }; echo ok \$c; done"
      - name: Image size
        run: docker image ls pack-test --format '{{.Size}}'

  postgres:
    # Migrations and core API flows against a real PostgreSQL server.
    runs-on: ubuntu-latest
    timeout-minutes: 15  # fail fast instead of hanging for hours
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cyberlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev,postgres]'
      - name: Migrations and API against PostgreSQL
        env:
          CYBERLAB_TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/cyberlab
        run: pytest tests/test_migrations.py -v
      - name: cyberlab db upgrade on a fresh database
        env:
          CYBERLAB_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/cyberlab
        run: |
          cyberlab db upgrade
          cyberlab db current

  docker-over-ssh:
    # The same real-Docker tests, but CyberLab reaches the engine through ssh:// as it would
    # on a user-owned server.
    runs-on: ubuntu-latest
    timeout-minutes: 20  # fail fast instead of hanging for hours
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Enable SSH to this runner with a key
        run: |
          sudo apt-get install -y openssh-server >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          chmod go-w ~
          sudo systemctl start ssh
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes "$USER@localhost" docker version --format '{{.Server.Version}}'
      - name: Real Docker tests through ssh://
        env:
          CYBERLAB_DOCKER_TESTS: "1"
          CYBERLAB_TEST_IMAGE_MIRROR: mirror.gcr.io
        run: |
          export CYBERLAB_TEST_DOCKER_HOST="ssh://$USER@localhost"
          pytest tests/test_docker_integration.py -v -k "not egress and not tool_pack"
