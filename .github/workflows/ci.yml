name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # fail fast instead of hanging for hours
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Validate registry and example manifests
        run: cyberlab manifest validate ../examples/manifests/*.yaml
      - name: Check committed JSON Schema is up to date
        run: |
          cyberlab manifest schema -o /tmp/schema.json
          diff -u ../spec/universe-manifest.schema.json /tmp/schema.json
      - name: Tests
        run: pytest

  docker-integration:
    # Starts real (hardened) containers through the API on the runner's Docker Engine.
    runs-on: ubuntu-latest
    timeout-minutes: 20  # fail fast instead of hanging for hours
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Real Docker integration tests
        env:
          CYBERLAB_DOCKER_TESTS: "1"
          CYBERLAB_DOCKER_BUILD_TESTS: "1"
          CYBERLAB_TEST_IMAGE_MIRROR: mirror.gcr.io
        run: pytest tests/test_docker_integration.py -v
      - name: Check nothing was left behind
        run: |
          test -z "$(docker ps -aq --filter label=dev.cyberlab.managed=true)"
          test -z "$(docker volume ls -q --filter label=dev.cyberlab.managed=true)"
          test -z "$(docker network ls -q --filter label=dev.cyberlab.managed=true)"

  image-plan:
    # Build list comes from the registry, so new tool packs are tested automatically.
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fail fast instead of hanging for hours
    needs: backend
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend'
      - id: plan
        run: echo "matrix=$(cyberlab --registry registry image matrix --bases ubuntu-24-04,debian-12,kali-rolling,parrot-core,blackarch)" >> "$GITHUB_OUTPUT"

  toolpack-images:
    # Builds every installable tool pack and checks each tool's command runs as the
    # unprivileged cyberlab user in a hardened container.
    name: toolpack (${{ matrix.pack }} on ${{ matrix.base }})
    runs-on: ubuntu-latest
    timeout-minutes: 20  # fail fast instead of hanging for hours
    needs: image-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend'
      - name: Render Dockerfile
        run: |
          cyberlab --registry registry image dockerfile --base "${{ matrix.base }}" \
            --packs "${{ matrix.pack }}" --mirror mirror.gcr.io > Dockerfile
          cat Dockerfile
      - name: Build
        # The mirror rate-limits images it does not cache (e.g. BlackArch when several jobs
        # start at once). On failure, build once more straight from Docker Hub; a real
        # package error fails both attempts.
        run: |
          docker build --tag pack-test - < Dockerfile && exit 0
          echo "::warning::build via mirror failed; retrying from Docker Hub"
          cyberlab --registry registry image dockerfile --base "${{ matrix.base }}" \
            --packs "${{ matrix.pack }}" > Dockerfile.direct
          docker build --tag pack-test - < Dockerfile.direct
      - name: Smoke test
        run: |
          CMDS="$(cyberlab --registry registry image commands --base "${{ matrix.base }}" --packs "${{ matrix.pack }}")"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --network none pack-test bash -c "
              set -e
              test \"\$(whoami)\" = cyberlab
              for c in $CMDS; do command -v \$c >/dev/null || { echo missing \$c; exit 1; }; echo ok \$c; done"
      - name: Image size
        run: docker image ls pack-test --format '{{.Size}}'

  desktop-images:
    # Builds the remote desktop on each system that offers it, then completes a VNC
    # handshake through `docker exec` in a hardened, network-less container.
    name: desktop (${{ matrix.base }})
    runs-on: ubuntu-latest
    timeout-minutes: 20  # fail fast instead of hanging for hours
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        base: [ubuntu-24-04, kali-rolling, parrot-core, blackarch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend'
      - name: Build
        run: |
          cyberlab --registry registry image dockerfile --base "${{ matrix.base }}" --desktop \
            --mirror mirror.gcr.io > Dockerfile
          docker build --tag desktop-test - < Dockerfile && exit 0
          echo "::warning::build via mirror failed; retrying from Docker Hub"
          cyberlab --registry registry image dockerfile --base "${{ matrix.base }}" --desktop \
            > Dockerfile.direct
          docker build --tag desktop-test - < Dockerfile.direct
      - name: VNC handshake in a hardened container
        run: |
          docker run -d --name desk --init --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m --network none \
            --tmpfs /workspace:rw,uid=1000,gid=1000 -e HOME=/workspace \
            desktop-test sleep infinity
          python3 - <<'PY'
          import subprocess
          for attempt in (1, 2):  # the second connection reuses the running desktop
              p = subprocess.Popen(["docker", "exec", "-i", "desk", "/usr/local/bin/cyberlab-desktop"],
                                   stdin=subprocess.PIPE, stdout=subprocess.PIPE)
              assert p.stdout.read(12) == b"RFB 003.008\n"
              p.stdin.write(b"RFB 003.008\n"); p.stdin.flush()
              n = p.stdout.read(1)[0]
              assert 1 in p.stdout.read(n)
              p.stdin.write(b"\x01"); p.stdin.flush()
              assert p.stdout.read(4) == b"\0\0\0\0"
              p.stdin.write(b"\x01"); p.stdin.flush()
              w, h = int.from_bytes(p.stdout.read(2), "big"), int.from_bytes(p.stdout.read(2), "big")
              assert (w, h) == (1280, 800), (w, h)
              print(f"connection {attempt}: VNC OK, screen {w}x{h}")
              p.kill()
          PY
      - name: Desktop logs (on failure)
        if: failure()
        run: |
          docker exec desk sh -c 'for f in /tmp/*.log; do echo "== $f"; tail -n 40 "$f"; done' || true
          docker exec desk sh -c 'ls -la /tmp /tmp/.X11-unix; command -v Xvfb x11vnc openbox xterm socat setsid nohup' || true
      - name: Image size
        if: always()
        run: docker image ls desktop-test --format '{{.Size}}'

  arm64-images:
    # Free ARM servers (e.g. Oracle Cloud Always Free) use arm64 processors. Builds each
    # system that supports arm64 with all of its tool packs and the desktop on a real
    # arm64 runner, checks every tool runs, and completes a VNC handshake.
    name: arm64 (${{ matrix.base }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30  # fail fast instead of hanging for hours
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        include:  # desktop only where the system offers it (Debian slim doesn't)
          - {base: ubuntu-24-04, desktop: "--desktop"}
          - {base: debian-12, desktop: ""}
          - {base: kali-rolling, desktop: "--desktop"}
          - {base: parrot-core, desktop: "--desktop"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend'
      - name: Packs for this system
        run: |
          PACKS="$(cyberlab --registry registry image matrix --bases "${{ matrix.base }}" \
            | python3 -c 'import json,sys; print(",".join(x["pack"] for x in json.load(sys.stdin)["include"]))')"
          echo "PACKS=$PACKS" >> "$GITHUB_ENV"
          echo "packs: $PACKS"
      - name: Build (all packs, plus the desktop where offered)
        run: |
          cyberlab --registry registry image dockerfile --base "${{ matrix.base }}" --packs "$PACKS" \
            ${{ matrix.desktop }} --mirror mirror.gcr.io > Dockerfile
          docker build --tag arm-test - < Dockerfile && exit 0
          echo "::warning::build via mirror failed; retrying from Docker Hub"
          cyberlab --registry registry image dockerfile --base "${{ matrix.base }}" --packs "$PACKS" \
            ${{ matrix.desktop }} > Dockerfile.direct
          docker build --tag arm-test - < Dockerfile.direct
      - name: Every tool runs, as the unprivileged user
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' arm-test)" = arm64
          CMDS="$(cyberlab --registry registry image commands --base "${{ matrix.base }}" --packs "$PACKS")"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --network none arm-test bash -c "
              set -e
              test \"\$(whoami)\" = cyberlab
              for c in $CMDS; do command -v \$c >/dev/null || { echo missing \$c; exit 1; }; echo ok \$c; done"
      - name: Desktop VNC handshake
        if: matrix.desktop != ''
        run: |
          docker run -d --name desk --init --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m --network none \
            --tmpfs /workspace:rw,uid=1000,gid=1000 -e HOME=/workspace arm-test sleep infinity
          python3 - <<'PY'
          import subprocess
          p = subprocess.Popen(["docker", "exec", "-i", "desk", "/usr/local/bin/cyberlab-desktop"],
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          assert p.stdout.read(12) == b"RFB 003.008\n"
          p.stdin.write(b"RFB 003.008\n"); p.stdin.flush()
          n = p.stdout.read(1)[0]
          assert 1 in p.stdout.read(n)
          p.stdin.write(b"\x01"); p.stdin.flush()
          assert p.stdout.read(4) == b"\0\0\0\0"
          p.stdin.write(b"\x01"); p.stdin.flush()
          w, h = int.from_bytes(p.stdout.read(2), "big"), int.from_bytes(p.stdout.read(2), "big")
          assert (w, h) == (1280, 800), (w, h)
          print(f"arm64 desktop OK, screen {w}x{h}")
          p.kill()
          PY
      - name: Image size
        if: always()
        run: docker image ls arm-test --format '{{.Size}}'

  arm64-integration:
    # The whole real-Docker test suite (machines, terminal, files, snapshots, desktop,
    # network rules) on an arm64 host, as CyberLab would run on a free ARM server.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25  # fail fast instead of hanging for hours
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Real Docker integration tests (arm64)
        env:
          CYBERLAB_DOCKER_TESTS: "1"
          CYBERLAB_DOCKER_BUILD_TESTS: "1"
          CYBERLAB_TEST_IMAGE_MIRROR: mirror.gcr.io
        run: |
          test "$(docker version --format '{{.Server.Arch}}')" = arm64
          pytest tests/test_docker_integration.py -v
      - name: Check nothing was left behind
        run: |
          test -z "$(docker ps -aq --filter label=dev.cyberlab.managed=true)"
          test -z "$(docker volume ls -q --filter label=dev.cyberlab.managed=true)"
          test -z "$(docker network ls -q --filter label=dev.cyberlab.managed=true)"

  postgres:
    # Migrations and core API flows against a real PostgreSQL server.
    runs-on: ubuntu-latest
    timeout-minutes: 15  # fail fast instead of hanging for hours
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cyberlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev,postgres]'
      - name: Migrations and API against PostgreSQL
        env:
          CYBERLAB_TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/cyberlab
        run: pytest tests/test_migrations.py -v
      - name: cyberlab db upgrade on a fresh database
        env:
          CYBERLAB_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/cyberlab
        run: |
          cyberlab db upgrade
          cyberlab db current

  docker-over-ssh:
    # The same real-Docker tests, but CyberLab reaches the engine through ssh:// as it would
    # on a user-owned server.
    runs-on: ubuntu-latest
    timeout-minutes: 20  # fail fast instead of hanging for hours
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Enable SSH to this runner with a key
        run: |
          sudo apt-get install -y openssh-server >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          chmod go-w ~
          sudo systemctl start ssh
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes "$USER@localhost" docker version --format '{{.Server.Version}}'
      - name: Real Docker tests through ssh://
        env:
          CYBERLAB_DOCKER_TESTS: "1"
          CYBERLAB_TEST_IMAGE_MIRROR: mirror.gcr.io
        run: |
          export CYBERLAB_TEST_DOCKER_HOST="ssh://$USER@localhost"
          pytest tests/test_docker_integration.py -v -k "not egress and not tool_pack"

  web:
    # The web app: type check, unit tests, production build, then real-browser tests
    # against a real control plane (development sign-in) and a real Docker Engine.
    runs-on: ubuntu-latest
    timeout-minutes: 20  # fail fast instead of hanging for hours
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e './backend'
      - name: Install web app dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and unit tests
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Browser tests (Chromium, real Docker)
        working-directory: frontend
        env:
          E2E_DOCKER: "1"
          E2E_IMAGE_MIRROR: mirror.gcr.io
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  installer:
    # scripts/install.sh on a fresh Ubuntu server: private mode, a real lab, an update that
    # keeps data, public mode behind Caddy with HTTPS and sign-in required, then uninstall.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install (private, this machine only)
        run: sudo ./scripts/install.sh --mirror mirror.gcr.io
      - name: The web app, the API and a real lab work
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/app/ | grep -q '<div id="root">'
          curl -fsS -X POST http://127.0.0.1:8000/v1/labs/linux-first-steps/start > lab.json
          python3 -c 'import json; d=json.load(open("lab.json")); assert d["setupError"] is None, d; print("lab", d["workspaceId"])'
          test -n "$(sudo docker ps -q --filter label=dev.cyberlab.managed=true)"
          # private mode is not reachable from other machines
          ! curl -s --max-time 3 "http://$(hostname -I | awk '{print $1}'):8000/healthz"
      - name: Running it again updates CyberLab and keeps the data
        run: |
          sudo ./scripts/install.sh --mirror mirror.gcr.io
          curl -fsS http://127.0.0.1:8000/v1/workspaces | grep -q linux-first-steps
      - name: Public mode (HTTPS through Caddy, sign-in required)
        run: |
          sudo ./scripts/install.sh --mirror mirror.gcr.io --domain localhost \
            --supabase-url https://abcdefghijklmnopqrst.supabase.co \
            --supabase-key sb_publishable_ci_placeholder_key_0123
          for i in $(seq 1 30); do curl -ksf https://localhost/healthz && break; sleep 2; done
          curl -ksf https://localhost/healthz
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost/v1/workspaces)" = 401
          curl -ksf https://localhost/v1/system/auth | grep -q supabase
          ! curl -s --max-time 3 http://127.0.0.1:8000/healthz  # only reachable through Caddy
          sudo stat -c '%a' /etc/cyberlab/cyberlab.env | grep -qx 600
      - name: Refuses public mode without sign-in
        run: "! sudo ./scripts/install.sh --domain example.org"
      - name: Uninstall
        run: |
          sudo ./scripts/install.sh --uninstall --purge
          test -z "$(sudo docker ps -aq --filter name=cyberlab)"
          test -z "$(sudo docker ps -aq --filter label=dev.cyberlab.managed=true)"
          ! sudo docker volume inspect cyberlab-data
      - name: Logs on failure
        if: failure()
        run: sudo docker logs --tail 80 cyberlab || true

  isolation:
    # Stronger isolation on real runtimes: gVisor (sandbox) and Kata Containers (microVM),
    # and full virtual machines (QEMU/KVM) booting a real ISO. GitHub's Linux runners have KVM.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend[dev]'
      - name: Install gVisor and Kata Containers with CyberLab's script
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo -E ./scripts/install-isolation.sh
      - name: CyberLab machines in a sandbox and in a microVM
        working-directory: backend
        env:
          CYBERLAB_DOCKER_TESTS: "1"
          CYBERLAB_TEST_IMAGE_MIRROR: mirror.gcr.io
          CYBERLAB_ISOLATION_TESTS: sandbox,microvm
          CYBERLAB_VM_TESTS: "1"
        run: pytest -v tests/test_docker_integration.py -k "stronger_isolation or full_vm"
