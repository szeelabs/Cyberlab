name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Validate registry and example manifests
        run: cyberlab manifest validate ../examples/manifests/*.yaml
      - name: Check committed JSON Schema is up to date
        run: |
          cyberlab manifest schema -o /tmp/schema.json
          diff -u ../spec/universe-manifest.schema.json /tmp/schema.json
      - name: Tests
        run: pytest
