id: web-secrets
title: "Web recon: find the secrets"
level: beginner
minutes: 30
topic: web
summary: A small web app leaks three secrets. Find them with curl the way a web tester does.
skills: [curl, page source, robots.txt, IDOR, HTTP]
introduction: |
  Web apps often leak information by accident: comments left in the page, "hidden" pages
  listed in robots.txt, or other people's data reachable by changing a number in the address.

  This lab has your machine "attacker" and a practice web app on the machine "target",
  reachable at http://target. Open the Terminal of "attacker" and use curl to talk to it.

  Only test web apps you own or are allowed to test, like this one.
spec:
  environments:
    - name: attacker
      baseImage: ubuntu-24-04
      resources: {cpu: 0.5, memoryMiB: 512, storageGiB: 3}
      toolPacks: [net-basics]
      network: {mode: lab}
      lifecycle: {idleTimeoutMinutes: 60, ttlHours: 24}
    - name: target
      role: target
      baseImage: lab-target
      resources: {cpu: 0.25, memoryMiB: 128, storageGiB: 1}
      network: {mode: lab}
      access: {terminal: false}
      lifecycle: {idleTimeoutMinutes: 60, ttlHours: 24}
  workspace: {storageGiB: 1}
setup:
  - environment: target
    path: .cyberlab-target.json
    generator: web-target
tasks:
  - id: source-flag
    title: Read the page source
    text: |
      Browsers hide HTML comments, but they are still in the page. Fetch the home page with
      `curl http://target/` and read everything it sends.
    answer: source-flag
    hints:
      - "Comments look like `<!-- ... -->`."
  - id: robots-flag
    title: What does robots.txt hide?
    text: |
      robots.txt tells search engines which pages not to index. It is public, so it often
      points attackers straight at the interesting pages. Read it, then visit what it hides.
    answer: robots-flag
    hints:
      - "`curl http://target/robots.txt`"
      - "Visit the path after `Disallow:`, for example `curl http://target/<path>/`"
  - id: idor-flag
    title: Read someone else's note
    text: |
      `curl http://target/api/notes` shows your notes. Each note has a number. What if you
      ask for a number that isn't yours? Apps that don't check who owns the data have an
      IDOR (Insecure Direct Object Reference) problem. Find the admin's note.
    answer: idor-flag
    hints:
      - "`curl \"http://target/api/notes?id=1\"` reads note 1. Try other numbers."
      - "Let a loop try many: `for i in $(seq 1 100); do curl -s \"http://target/api/notes?id=$i\"; echo; done | grep admin`"
