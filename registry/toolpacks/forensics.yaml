id: forensics
name: Digital Forensics
version: 0.1.0
category: digital-forensics
description: File-system, memory-image and firmware evidence analysis.
risk: low
compatibleBases: [ubuntu-24-04, debian-12, kali-rolling]
minResources: {cpu: 1, memoryMiB: 2048, storageGiB: 4}
tools:
  - {name: The Sleuth Kit, purpose: Disk image and file-system analysis, homepage: "https://www.sleuthkit.org"}
  - {name: Volatility 3, purpose: Memory image analysis, homepage: "https://github.com/volatilityfoundation/volatility3"}
  - {name: binwalk, purpose: Firmware image inspection, homepage: "https://github.com/ReFirmLabs/binwalk"}
