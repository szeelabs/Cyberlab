id: crypto
name: Cryptography Toolkit
version: 0.1.0
category: cryptography
description: Encryption, signing, certificate and encoding utilities.
risk: low
compatibleBases: [ubuntu-24-04, debian-12, kali-rolling]
minResources: {cpu: 0.25, memoryMiB: 256, storageGiB: 1}
tools:
