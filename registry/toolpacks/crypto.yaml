id: crypto
name: Cryptography Toolkit
version: 0.1.0
category: cryptography
description: Encryption, signing, certificate and encoding utilities.
status: buildable
risk: low
compatibleBases: [ubuntu-24-04, debian-12, kali-rolling, parrot-core, blackarch]
minResources: {cpu: 0.25, memoryMiB: 256, storageGiB: 1}
tools:
  - {name: OpenSSL, purpose: "TLS, certificates and primitives", homepage: "https://www.openssl.org", package: openssl, archPackage: openssl, command: openssl}
  - {name: GnuPG, purpose: OpenPGP encryption and signing, homepage: "https://gnupg.org", package: gnupg, archPackage: gnupg, command: gpg}
  - {name: age, purpose: Simple modern file encryption, homepage: "https://age-encryption.org", package: age, archPackage: age, command: age}
