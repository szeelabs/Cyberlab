[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberlab"
version = "0.1.0"
description = "CyberLab control plane: Universe Manifest, registry and API foundation"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "pyjwt[crypto]>=2.8",
  "uvicorn>=0.30",
  "websockets>=12",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "httpx>=0.27", "ruff>=0.5", "jsonschema>=4.22", "boto3>=1.34", "moto[server]>=5",
  "anthropic>=2.8",
]
s3 = ["boto3>=1.34"]
ai = ["anthropic>=2.8"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
cyberlab = "cyberlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyberlab = [
  "static/*", "static/vendor/xterm/*", "migrations/script.py.mako", "execution/desktop.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
